version: "2"
linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - bodyclose
    - noctx
    - contextcheck
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: true
      disable:
        - fieldalignment
run:
  timeout: 5m
  go: "1.25"
issues:
  max-issues-per-linter: 50
  max-same-issues: 20
formatters:
  enable:
    - gofmt
    - goimports
